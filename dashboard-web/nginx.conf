# Same as nginx's default config, plus "no-cache": the dashboard has no
# content-hashed files, so the browser must revalidate everything (ETag) or it
# keeps running an old sepadashboard.js after an image update.
server {
    listen       80;
    server_name  localhost;
    root         /usr/share/nginx/html;
    index        index.html index.htm;

    add_header Cache-Control "no-cache";

    error_page   500 502 503 504  /50x.html;
}
